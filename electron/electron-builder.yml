# Packaging for Windows and Linux. Artifact names carry no version, so the README's
# releases/latest/download/... links always point at the newest build.
appId: com.blcnyy.purrloader
productName: Purrloader
copyright: Copyright © 2026 Ömer Balkan
directories:
  output: dist
  buildResources: assets
files:
  - package.json
  - src/**/*
  - assets/**/*
  - "!src/main/dev-snapshot.js"
  - "!node_modules/@fontsource-variable/inter/files/*-italic.woff2"
  - "!node_modules/@fontsource-variable/inter/files/*-standard-*.woff2"
  - "!node_modules/@fontsource-variable/inter/files/*-wght-*.woff2"
  - "!**/*.map"
  - "!**/*.d.ts"

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  # Like dragging a Mac app into Applications: no questions, installs for this user, opens when done.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Purrloader
  deleteAppDataOnUninstall: false
  # One installer per processor rather than one that carries both.
  buildUniversalInstaller: false
  artifactName: Purrloader-Setup-${arch}.${ext}

linux:
  # The standard icon sizes; some desktops don't look beyond 512.
  icon: assets/linux
  category: AudioVideo
  synopsis: Save videos and audio from the web
  description: Paste a link, press Download. A friendly front end for yt-dlp.
  maintainer: BLCNYY <https://github.com/BLCNYY>
  vendor: BLCNYY
  executableName: purrloader
  # So desktops match the running window to purrloader.desktop and show its icon.
  syncDesktopName: true
  # The .tar.gz; AppImage and .deb name themselves below.
  artifactName: Purrloader-linux-${arch}.${ext}
  desktop:
    entry:
      Name: Purrloader
      Comment: Save videos and audio from the web
      Keywords: download;video;audio;youtube;yt-dlp;
      StartupWMClass: Purrloader
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
appImage:
  artifactName: Purrloader-${arch}.${ext}
deb:
  artifactName: purrloader_${arch}.${ext}
  # Electron's usual libraries, plus xz for unpacking FFmpeg.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - xz-utils
