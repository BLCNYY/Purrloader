[package]
name = "purrloader"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Save videos and audio from the web"
repository = "https://github.com/BLCNYY/Purrloader"
build = "build.rs"
default-run = "purrloader"

[features]
test-helper = []

[[bin]]
name = "purrloader-test-helper"
path = "test-support/helper.rs"
required-features = ["test-helper"]

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.33.3", features = ["http", "image", "svg"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
notify-rust = "4"
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tar = "0.4"
tempfile = "3"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
uuid = { version = "1", features = ["v4", "serde"] }
unicode-normalization = "0.1"
walkdir = "2"
xz2 = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
window-vibrancy = "0.6"
raw-window-handle = "0.6"

# Enable accessibility on the shipping platforms. The macOS development build
# avoids AccessKit's WinitView teardown/KVO crash; the released Mac app is SwiftUI.
[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["accesskit"] }

[build-dependencies]
winresource = "0.1"
