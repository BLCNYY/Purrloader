name: Release (Windows and Linux)

# Builds the Windows and Linux apps for a version tag and attaches them to that tag's GitHub release, as a draft
# if it doesn't exist yet. The Mac DMG is signed and notarized locally with release.sh and uploaded to the same
# release; publish the draft once it's there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v1.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Rust build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            arch: x64
            triple: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            arch: arm64
            triple: aarch64-pc-windows-msvc
          - name: linux-x64
            os: ubuntu-22.04
            arch: x64
            triple: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            arch: arm64
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev liblzma-dev squashfs-tools desktop-file-utils
      - name: Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/NSIS/makensis.exe")) { choco install nsis -y --no-progress }
      - name: Test
        run: cargo test --locked --all-features
      - name: Build
        run: cargo build --locked --release --bin purrloader --target ${{ matrix.triple }}
      - name: Dependency licenses
        shell: bash
        run: |
          cargo install cargo-about --locked --version 0.9.3 --features cli
          cargo about generate --target ${{ matrix.triple }} desktop/packaging/licenses.hbs -o THIRD_PARTY_LICENSES.html
      - name: Package Linux
        if: runner.os == 'Linux'
        run: python3 desktop/packaging/package.py --arch ${{ matrix.arch }} --binary target/${{ matrix.triple }}/release/purrloader --licenses THIRD_PARTY_LICENSES.html
      - name: Package Windows
        if: runner.os == 'Windows'
        run: python desktop/packaging/package.py --arch ${{ matrix.arch }} --binary target/${{ matrix.triple }}/release/purrloader.exe --licenses THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@v4
        with:
          name: purrloader-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.tar.gz

  release:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Purrloader ${TAG#v}" --generate-notes
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          gh release upload "$TAG" artifacts/* --clobber
