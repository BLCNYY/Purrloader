name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check formatting
        run: swift format lint --strict -r Sources Tests

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: ./build.sh

  windows-linux:
    name: Windows and Linux app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Package (unpacked)
        run: npx electron-builder --dir --publish never
